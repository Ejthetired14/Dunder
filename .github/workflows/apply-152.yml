name: apply-152

on:
  push:
    paths:
      - .github/workflows/apply-152.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply patch
        run: |
          set -euo pipefail
          curl -fsSL https://paste.rs/IPByi -o /tmp/v152.patch
          echo "f20dc80d7d11c5ad82ed730ab89063b46f2297737ca78ec85b1f8f4c656b115d  /tmp/v152.patch" | sha256sum -c -
          git apply --whitespace=nowarn /tmp/v152.patch
          git -c user.email="dunder-bot@users.noreply.github.com" -c user.name="dunder-bot" commit -am "fix: keep office data on upgrade, shared project folder, per-agent background browsers"
          git push origin HEAD:main

      - name: Remove helper
        run: |
          set -euo pipefail
          git rm .github/workflows/apply-152.yml
          git -c user.email="dunder-bot@users.noreply.github.com" -c user.name="dunder-bot" commit -m "chore: remove patch helper"
          git push origin HEAD:main
