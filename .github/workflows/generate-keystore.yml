name: Generate Release Keystore (run once, then add to Secrets)

on:
  workflow_dispatch:
    inputs:
      alias:
        description: Key alias
        required: true
        default: dunder
      storepass:
        description: Keystore password
        required: true
      keypass:
        description: Key password
        required: true
      dname:
        description: Distinguished name (CN=..., O=..., C=US)
        required: true
        default: "CN=Dunder, O=Dunder, C=US"
      validity:
        description: Validity in days
        required: true
        default: "10000"

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Generate keystore & output base64
        id: gen
        env:
          ALIAS: ${{ github.event.inputs.alias }}
          STOREPASS: ${{ github.event.inputs.storepass }}
          KEYPASS: ${{ github.event.inputs.keypass }}
          DNAME: ${{ github.event.inputs.dname }}
          VALIDITY: ${{ github.event.inputs.validity }}
        run: |
          # Generate keystore
          keytool -genkeypair -v \
            -keystore /tmp/release.jks \
            -alias "$ALIAS" \
            -keyalg RSA \
            -keysize 2048 \
            -validity "$VALIDITY" \
            -storepass "$STOREPASS" \
            -keypass "$KEYPASS" \
            -dname "$DNAME" \
            -noprompt

          # Output base64 (copy this to GitHub Secrets → KEYSTORE_BASE64)
          BASE64=$(base64 -w0 /tmp/release.jks)
          echo "KEYSTORE_BASE64<<EOF" >> $GITHUB_OUTPUT
          echo "$BASE64" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

          # Also output the values for easy copy
          echo "alias=$ALIAS" >> $GITHUB_OUTPUT
          echo "storepass=$STOREPASS" >> $GITHUB_OUTPUT
          echo "keypass=$KEYPASS" >> $GITHUB_OUTPUT
          echo "dname=$DNAME" >> $GITHUB_OUTPUT

      - name: Show secrets to add
        run: |
          echo "=========================================="
          echo "ADD THESE TO GITHUB SETTINGS → SECRETS → ACTIONS:"
          echo "=========================================="
          echo ""
          echo "Name: KEYSTORE_BASE64"
          echo "Value: ${{ steps.gen.outputs.KEYSTORE_BASE64 }}"
          echo ""
          echo "Name: KEYSTORE_PASSWORD"
          echo "Value: ${{ steps.gen.outputs.storepass }}"
          echo ""
          echo "Name: KEY_ALIAS"
          echo "Value: ${{ steps.gen.outputs.alias }}"
          echo ""
          echo "Name: KEY_PASSWORD"
          echo "Value: ${{ steps.gen.outputs.keypass }}"
          echo ""
          echo "=========================================="
          echo "⚠️  Copy KEYSTORE_BASE64 EXACTLY (it's very long)"
          echo "⚠️  Save these values somewhere safe too!"
          echo "=========================================="

      - name: Upload keystore as artifact (backup)
        uses: actions/upload-artifact@v4
        with:
          name: generated-keystore
          path: /tmp/release.jks
          retention-days: 30