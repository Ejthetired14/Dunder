name: Generate Release Keystore

on:
  workflow_dispatch:

jobs:
  generate:
    name: Generate Keystore
    runs-on: ubuntu-latest
    steps:
      - name: Generate passwords
        id: passwords
        run: |
          STORE_PASS=$(openssl rand -base64 24 | tr -d "=+/")
          KEY_PASS=$(openssl rand -base64 24 | tr -d "=+/")
          echo "store_pass=$STORE_PASS" >> $GITHUB_OUTPUT
          echo "key_pass=$KEY_PASS" >> $GITHUB_OUTPUT

      - name: Generate keystore
        run: |
          keytool -genkey -v \
            -keystore release-key.jks \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -alias dunder-release \
            -storepass "${{ steps.passwords.outputs.store_pass }}" \
            -keypass "${{ steps.passwords.outputs.key_pass }}" \
            -dname "CN=Dunder Release, OU=Dunder, O=Dunder, L=Local, ST=State, C=US"

      - name: Encode keystore to base64
        id: encode
        run: |
          BASE64=$(base64 -w 0 release-key.jks)
          echo "keystore_base64=$BASE64" >> $GITHUB_OUTPUT

      - name: Output secrets (copy these to GitHub Secrets)
        run: |
          echo "=========================================="
          echo "COPY THESE TO: Settings → Secrets → Actions"
          echo "=========================================="
          echo ""
          echo "KEYSTORE_BASE64:"
          echo "${{ steps.encode.outputs.keystore_base64 }}"
          echo ""
          echo "KEYSTORE_PASSWORD:"
          echo "${{ steps.passwords.outputs.store_pass }}"
          echo ""
          echo "KEY_ALIAS:"
          echo "dunder-release"
          echo ""
          echo "KEY_PASSWORD:"
          echo "${{ steps.passwords.outputs.key_pass }}"
          echo ""
          echo "=========================================="
          echo "SAVE THESE SECURELY - they won't be shown again"
          echo "=========================================="

      - name: Upload keystore as artifact (optional backup)
        uses: actions/upload-artifact@v4
        with:
          name: release-keystore
          path: release-key.jks
          retention-days: 1