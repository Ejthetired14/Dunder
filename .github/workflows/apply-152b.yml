name: apply-152b

on:
  push:
    paths:
      - .github/workflows/apply-152b.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add the new files
        run: |
          set -euo pipefail
          curl -fsSL https://paste.rs/J6vgP -o /tmp/v152b.patch
          echo "7287eff419d3bb94c0a3e348fa93b0866046540a2bc02117b7c29e8bdd7b1df5  /tmp/v152b.patch" | sha256sum -c -
          git apply --whitespace=nowarn /tmp/v152b.patch
          git add -A
          git -c user.email="dunder-bot@users.noreply.github.com" -c user.name="dunder-bot" commit -m "feat: per-agent background browsers and the shared project screen"
          git push origin HEAD:main

      - name: Remove helper
        run: |
          set -euo pipefail
          git rm .github/workflows/apply-152b.yml
          git -c user.email="dunder-bot@users.noreply.github.com" -c user.name="dunder-bot" commit -m "chore: remove patch helper"
          git push origin HEAD:main
