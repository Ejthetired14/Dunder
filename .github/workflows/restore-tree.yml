name: Restore 203 tree
on:
  push:
    paths:
      - .github/workflows/restore-tree.yml
permissions:
  contents: write
jobs:
  restore:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore
        run: |
          set -euo pipefail
          git fetch --tags origin
          git read-tree --reset -u v1.0.203
          git checkout origin/main -- .github/workflows/build-apk.yml .github/workflows/restore-tree.yml
          sed -i 's/versionCode = 203/versionCode = 209/; s/versionName = "1.0.203"/versionName = "1.0.209"/' app/build.gradle.kts
          grep -E 'versionCode|versionName' app/build.gradle.kts
          git add -A
          git -c user.name="Dunder Agent" -c user.email="agent@dunder.invalid" commit -q -m "feat: restore the v1.0.203 app (UI/UX, pixel office, projects, agent browsers, data migrations)"
          git push origin HEAD:refs/heads/main
