name: Cleanup artifacts
on:
  push:
    paths:
      - .github/workflows/cleanup.yml
permissions:
  actions: write
jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - name: Delete duplicate pages artifacts
        run: |
          set +e
          gh api -X DELETE repos/${{ github.repository }}/actions/artifacts/14719004756
          gh api -X DELETE repos/${{ github.repository }}/actions/artifacts/14720405704
