name: Lint

on:
  push:
    branches: [ main, kilo/** ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# Report-only: lint results never block the build or a merge.
permissions:
  contents: read

jobs:
  lint:
    name: Lint (report only, non-blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper
          cache-read-only: false

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false
          packages: >-
            platform-tools
            platforms;android-34
            platforms;android-35
            build-tools;34.0.0
            build-tools;35.0.0

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # CI-1: run Android lint in CI. continue-on-error + `|| true` so lint
      # findings (pre-existing or new) never block the build or a merge.
      - name: Lint (report only; does not block the build)
        continue-on-error: true
        run: ./gradlew lintDebug --no-daemon --stacktrace || true
