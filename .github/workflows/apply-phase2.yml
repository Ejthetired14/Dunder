name: Apply phase 2 patch

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  apply:
    if: contains(github.event.head_commit.message, '[apply-phase2]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch the phase 2 branch
        run: |
          set -euo pipefail
          git config user.name "Dunder Agent"
          git config user.email "agent@dunder.invalid"
          git fetch origin ui/pixel-office-phase2
          git checkout -B phase2-patched FETCH_HEAD
          curl -fsSL https://paste.rs/S2mq7 -o /tmp/p.patch
          git apply --binary /tmp/p.patch
          git rm -q app/src/main/res/drawable/office_tileset.png
          git add -A
          git commit -m "fix(ui): keep the office header and HUD fixes in phase 2; bump 1.0.215"
          git push origin HEAD:ui/pixel-office-phase2
      - name: Remove this workflow from main
        run: |
          set -euo pipefail
          git config user.name "Dunder Agent"
          git config user.email "agent@dunder.invalid"
          git checkout -B main-clean origin/main
          git rm -q .github/workflows/apply-phase2.yml
          git commit -m "ci: drop the phase 2 patch applier"
          git push origin HEAD:main
