name: Build APK

on:
  push:
    branches: [ main, kilo/** ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    name: Build Debug & Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version_name: ${{ steps.version.outputs.version_name }}
      version_code: ${{ steps.version.outputs.version_code }}
      release_url: ${{ steps.release.outputs.html_url }}
      release_notes: ${{ steps.release.outputs.body }}
      apk_url: ${{ steps.apk_url.outputs.url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 35
          ndk-version: r27c
          build-tools-version: 35.0.0
          cmake-version: 3.22.1
          emulator: false
          packages: ''

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses

      - name: Install required SDK packages
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools" "cmdline-tools;latest"

      - name: Cache Gradle wrapper
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/wrapper
            ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Extract version from build.gradle.kts
        id: version
        run: |
          VERSION_NAME=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          VERSION_CODE=$(grep -oP 'versionCode\s*=\s*\K\d+' app/build.gradle.kts)
          echo "version_name=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "version_code=$VERSION_CODE" >> $GITHUB_OUTPUT

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Build Release APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Generate and Sign Release APK
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          # Use keystore from secrets if available, otherwise generate new one
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ] && [ -n "${{ secrets.KEYSTORE_PASSWORD }}" ]; then
            echo "Using existing keystore from secrets..."
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > release-key.jks
            PASS="${{ secrets.KEYSTORE_PASSWORD }}"
            KEY_ALIAS="${{ secrets.KEY_ALIAS }}"
            KEY_PASSWORD="${{ secrets.KEY_PASSWORD }}"
            echo "Keystore loaded from secrets successfully"
          else
            echo "No keystore secrets found, generating new one..."
            PASS=$(openssl rand -base64 24 | tr -d "=+/")
            KEY_ALIAS="dunder-release"
            KEY_PASSWORD="$PASS"
            
            keytool -genkey -v \
              -keystore release-key.jks \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -alias "$KEY_ALIAS" \
              -storepass "$PASS" \
              -keypass "$KEY_PASSWORD" \
              -dname "CN=Dunder Release, OU=Dunder, O=Dunder, L=Local, ST=State, C=US"
            
            # Output the keystore info for future releases (copy to secrets)
            BASE64=$(base64 -w 0 release-key.jks)
            echo ""
            echo "=========================================="
            echo "SAVE THESE FOR FUTURE RELEASES (Settings → Secrets → Actions):"
            echo "=========================================="
            echo "KEYSTORE_BASE64:"
            echo "$BASE64"
            echo ""
            echo "KEYSTORE_PASSWORD:"
            echo "$PASS"
            echo ""
            echo "KEY_ALIAS:"
            echo "$KEY_ALIAS"
            echo ""
            echo "KEY_PASSWORD:"
            echo "$KEY_PASSWORD"
            echo "=========================================="
          fi
          
          # Find apksigner
          APKSIGNER_PATH=$(find $ANDROID_HOME -name "apksigner" -type f | head -1)
          if [ -z "$APKSIGNER_PATH" ]; then
            echo "apksigner not found in ANDROID_HOME"
            exit 1
          fi
          echo "Using apksigner: $APKSIGNER_PATH"
          
          # Sign the APK
          "$APKSIGNER_PATH" sign \
            --ks release-key.jks \
            --ks-pass pass:"$PASS" \
            --ks-key-alias "$KEY_ALIAS" \
            --key-pass pass:"$KEY_PASSWORD" \
            --out app/build/outputs/apk/release/app-release-signed.apk \
            app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Create Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        id: release
        run: |
          if [ -f "app/build/outputs/apk/release/app-release-signed.apk" ]; then
            RELEASE_APK="app/build/outputs/apk/release/app-release-signed.apk"
          else
            RELEASE_APK="app/build/outputs/apk/release/app-release-unsigned.apk"
          fi
          gh release create ${{ github.ref_name }} \
            app/build/outputs/apk/debug/app-debug.apk \
            "$RELEASE_APK" \
            --title "Dunder v${{ github.ref_name }}" \
            --notes "Debug and release APKs for ${{ github.ref_name }}"
          RELEASE_INFO=$(gh release view ${{ github.ref_name }} --json url,body --jq '{url: .url, body: .body}')
          echo "html_url=$(echo $RELEASE_INFO | jq -r .url)" >> $GITHUB_OUTPUT
          echo "body=$(echo $RELEASE_INFO | jq -r .body | sed ':a;N;$!ba;s/\n/\\n/g' | sed 's/"/\\"/g')" >> $GITHUB_OUTPUT
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Get APK download URL
        if: startsWith(github.ref, 'refs/tags/v')
        id: apk_url
        run: |
          if [ -f "app/build/outputs/apk/release/app-release-signed.apk" ]; then
            APK_NAME="app-release-signed.apk"
          else
            APK_NAME="app-release-unsigned.apk"
          fi
          URL="https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/$APK_NAME"
          echo "url=$URL" >> $GITHUB_OUTPUT

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: app-release-unsigned
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          retention-days: 30

      - name: Upload Signed Release APK
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: app-release-signed
          path: app/build/outputs/apk/release/app-release-signed.apk
          retention-days: 30

      - name: Upload APKs to workflow run (always available)
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: all-apks
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release-unsigned.apk
            app/build/outputs/apk/release/app-release-signed.apk
          retention-days: 30

  deploy-pages:
    name: Deploy Latest Release to GitHub Pages
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Create latest-release.json
        run: |
          PUBLISHED_AT=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          cat > latest-release.json << EOF
          {
            "versionName": "${{ needs.build.outputs.version_name }}",
            "versionCode": ${{ needs.build.outputs.version_code }},
            "releaseUrl": "${{ needs.build.outputs.release_url }}",
            "releaseNotes": "${{ needs.build.outputs.release_notes }}",
            "apkUrl": "${{ needs.build.outputs.apk_url }}",
            "tagName": "${{ github.ref_name }}",
            "publishedAt": "$PUBLISHED_AT"
          }
          EOF
          cat latest-release.json

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
          name: latest-release

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: latest-release