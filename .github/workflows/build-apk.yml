name: Build APK

on:
  push:
    branches: [ main, kilo/** ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    name: Build Debug & Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      version_name: ${{ steps.version.outputs.version_name }}
      version_code: ${{ steps.version.outputs.version_code }}
      release_url: ${{ steps.release.outputs.html_url }}
      release_notes: ${{ steps.release.outputs.body }}
      apk_url: ${{ steps.apk_url.outputs.url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 34
          build-tools-version: 34.0.0
          emulator: false
          packages: 'platforms;android-34 build-tools;34.0.0 platform-tools'

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/wrapper
            ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Print versions
        run: |
          java -version
          ./gradlew --version

      - name: Extract version
        id: version
        run: |
          VERSION_NAME=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          VERSION_CODE=$(grep -oP 'versionCode\s*=\s*\K\d+' app/build.gradle.kts)
          echo "version_name=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "version_code=$VERSION_CODE" >> $GITHUB_OUTPUT

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon -x lint --stacktrace

      - name: Build Release APK
        run: ./gradlew assembleRelease --no-daemon -x lint --stacktrace

      - name: Sign Release APK
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          
          APKSIGNER=$(find $ANDROID_HOME -name "apksigner" -type f | head -1)
          [ -z "$APKSIGNER" ] && { echo "apksigner not found"; exit 1; }
          
          UNSIGNED="app/build/outputs/apk/release/app-release-unsigned.apk"
          [ ! -f "$UNSIGNED" ] && { echo "Unsigned APK missing"; find app/build -name "*.apk" 2>/dev/null; exit 1; }
          
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ] && [ -n "${{ secrets.KEYSTORE_PASSWORD }}" ]; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > release-key.jks
            PASS="${{ secrets.KEYSTORE_PASSWORD }}"
            ALIAS="${{ secrets.KEY_ALIAS }}"
            KPASS="${{ secrets.KEY_PASSWORD }}"
          else
            echo "Generating temporary keystore..."
            PASS=$(openssl rand -base64 24 | tr -d "=+/")
            ALIAS="dunder-release"
            KPASS="$PASS"
            keytool -genkey -v -keystore release-key.jks -keyalg RSA -keysize 2048 -validity 10000 -alias "$ALIAS" -storepass "$PASS" -keypass "$KPASS" -dname "CN=Dunder,O=Dunder,L=Local,ST=State,C=US"
          fi
          
          "$APKSIGNER" sign --ks release-key.jks --ks-pass pass:"$PASS" --ks-key-alias "$ALIAS" --key-pass pass:"$KPASS" --out app/build/outputs/apk/release/app-release-signed.apk "$UNSIGNED"
          echo "Signed OK"

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        id: release
        run: |
          APK="app/build/outputs/apk/release/app-release-signed.apk"
          [ ! -f "$APK" ] && APK="app/build/outputs/apk/release/app-release-unsigned.apk"
          
          gh release delete ${{ github.ref_name }} --yes 2>/dev/null || true
          gh release create ${{ github.ref_name }} \
            app/build/outputs/apk/debug/app-debug.apk \
            "$APK" \
            --title "Dunder ${{ github.ref_name }}" \
            --notes "Debug and release APKs for ${{ github.ref_name }}"
          
          URL=$(gh release view ${{ github.ref_name }} --json url --jq .url)
          BODY=$(gh release view ${{ github.ref_name }} --json body --jq .body | sed ':a;N;$!ba;s/\n/\\n/g' | sed 's/"/\\"/g')
          echo "html_url=$URL" >> $GITHUB_OUTPUT
          echo "body=$BODY" >> $GITHUB_OUTPUT
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: APK URL
        if: startsWith(github.ref, 'refs/tags/v')
        id: apk_url
        run: |
          APK="app/build/outputs/apk/release/app-release-signed.apk"
          [ ! -f "$APK" ] && APK="app/build/outputs/apk/release/app-release-unsigned.apk"
          NAME=$(basename "$APK")
          echo "url=https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/$NAME" >> $GITHUB_OUTPUT

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: apks
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release-unsigned.apk
            app/build/outputs/apk/release/app-release-signed.apk
          retention-days: 30

  deploy-pages:
    name: Deploy to GitHub Pages
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Create latest-release.json
        run: |
          cat > latest-release.json << 'EOF'
          {
            "versionName": "${{ needs.build.outputs.version_name }}",
            "versionCode": ${{ needs.build.outputs.version_code }},
            "releaseUrl": "${{ needs.build.outputs.release_url }}",
            "releaseNotes": "${{ needs.build.outputs.release_notes }}",
            "apkUrl": "${{ needs.build.outputs.apk_url }}",
            "tagName": "${{ github.ref_name }}",
            "publishedAt": "$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          }
          EOF
          cat latest-release.json

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
          name: latest-release

      - name: Deploy Pages
        uses: actions/deploy-pages@v4
        with:
          artifact_name: latest-release