name: Build APK

on:
  push:
    branches: [ main, kilo/** ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# SEC-3: least privilege by default; jobs that need more declare it themselves.
permissions:
  contents: read

jobs:
  build:
    name: Build Debug & Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Needed only by the release step on tags (gh release create).
    permissions:
      contents: write
    outputs:
      version_name: ${{ steps.version.outputs.version_name }}
      version_code: ${{ steps.version.outputs.version_code }}
      release_url: ${{ steps.release.outputs.html_url }}
      release_notes: ${{ steps.release.outputs.body }}
      apk_url: ${{ steps.apk_url.outputs.url }}
      apk_sha256: ${{ steps.apk_sha.outputs.sha256 }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper
          cache-read-only: false

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false
          packages: >-
            platform-tools
            platforms;android-34
            platforms;android-35
            build-tools;34.0.0
            build-tools;35.0.0

      - name: Verify SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms"
          ls "$ANDROID_HOME/build-tools"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Print versions
        run: |
          java -version
          ./gradlew --version

      - name: Extract version
        id: version
        run: |
          VERSION_NAME=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          VERSION_CODE=$(grep -oP 'versionCode\s*=\s*\K\d+' app/build.gradle.kts)
          echo "version_name=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "version_code=$VERSION_CODE" >> $GITHUB_OUTPUT

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon -x lint --stacktrace

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - name: Build Release APK
        run: ./gradlew assembleRelease --no-daemon -x lint --stacktrace

      - name: Find APKs
        id: find-apks
        run: |
          set +e
          ls -la app/build/outputs/apk/debug
          ls -la app/build/outputs/apk/release

          DEBUG_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$DEBUG_APK" ]; then
            DEBUG_APK=$(find app/build -name '*debug*.apk' | head -1)
          fi

          RELEASE_APK_UNSIGNED="app/build/outputs/apk/release/app-release-unsigned.apk"
          if [ ! -f "$RELEASE_APK_UNSIGNED" ]; then
            RELEASE_APK_UNSIGNED=$(find app/build -name '*.apk' -not -name '*debug*' -not -name '*signed*' | head -1)
          fi

          if [ -z "$DEBUG_APK" ] || [ ! -f "$DEBUG_APK" ]; then
            echo "::error::No debug APK was produced"
            exit 1
          fi
          if [ -z "$RELEASE_APK_UNSIGNED" ] || [ ! -f "$RELEASE_APK_UNSIGNED" ]; then
            echo "::error::No unsigned release APK was produced"
            exit 1
          fi

          echo "DEBUG_APK=$DEBUG_APK" >> $GITHUB_OUTPUT
          echo "RELEASE_APK_UNSIGNED=$RELEASE_APK_UNSIGNED" >> $GITHUB_OUTPUT
          echo "debug APK: $DEBUG_APK"
          echo "release APK: $RELEASE_APK_UNSIGNED"

      # SEC-3: signing fails closed. No keystore secrets -> the release job fails.
      # It never generates a temporary key (each release would get a different
      # signature and Android would refuse in-place updates). See docs/release-signing.md.
      - name: Sign Release APK
        if: startsWith(github.ref, 'refs/tags/v')
        id: sign-apk
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          UNSIGNED: ${{ steps.find-apks.outputs.RELEASE_APK_UNSIGNED }}
        run: |
          set -euo pipefail

          missing=""
          for v in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS; do
            if [ -z "${!v:-}" ]; then missing="$missing $v"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Release signing secrets missing:$missing. Add them as repository secrets (see docs/release-signing.md). Refusing to sign with a temporary key."
            exit 1
          fi
          # Key password defaults to the store password (PKCS12 keystores use one password).
          export KEY_PASSWORD="${KEY_PASSWORD:-$KEYSTORE_PASSWORD}"

          APKSIGNER=$(find "$ANDROID_HOME" -name "apksigner" -type f | head -1)
          [ -n "$APKSIGNER" ] || { echo "::error::apksigner not found"; exit 1; }
          [ -n "$UNSIGNED" ] && [ -f "$UNSIGNED" ] || { echo "::error::Unsigned APK missing: $UNSIGNED"; exit 1; }

          KS="$RUNNER_TEMP/release-key.jks"
          trap 'rm -f "$KS"' EXIT
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$KS"

          SIGNED="app/build/outputs/apk/release/app-release-signed.apk"
          "$APKSIGNER" sign --ks "$KS" --ks-pass env:KEYSTORE_PASSWORD --ks-key-alias "$KEY_ALIAS" --key-pass env:KEY_PASSWORD --out "$SIGNED" "$UNSIGNED"
          "$APKSIGNER" verify --print-certs "$SIGNED"
          echo "SIGNED_APK=$SIGNED" >> $GITHUB_OUTPUT
          echo "Signed OK: $SIGNED"

      # SEC-3: only the signed release APK is published; the debug APK stays a CI artifact.
      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        id: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          SIGNED_APK: ${{ steps.sign-apk.outputs.SIGNED_APK }}
        run: |
          set -euo pipefail
          [ -f "$SIGNED_APK" ] || { echo "::error::Signed APK not found: $SIGNED_APK"; exit 1; }

          gh release delete "$TAG" --yes 2>/dev/null || true
          gh release create "$TAG" \
            "$SIGNED_APK" \
            --title "Dunder $TAG" \
            --notes "Release APK for $TAG"

          URL=$(gh release view "$TAG" --json url --jq .url)
          BODY=$(gh release view "$TAG" --json body --jq .body | sed ':a;N;$!ba;s/\n/\\n/g' | sed 's/"/\\"/g')
          echo "html_url=$URL" >> $GITHUB_OUTPUT
          echo "body=$BODY" >> $GITHUB_OUTPUT

      - name: APK URL
        if: startsWith(github.ref, 'refs/tags/v')
        id: apk_url
        env:
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
          SIGNED_APK: ${{ steps.sign-apk.outputs.SIGNED_APK }}
        run: |
          echo "url=https://github.com/$REPO/releases/download/$TAG/$(basename "$SIGNED_APK")" >> $GITHUB_OUTPUT

      # SEC-10: publish the SHA-256 of the signed APK so the app can verify the download.
      - name: APK SHA-256
        if: startsWith(github.ref, 'refs/tags/v')
        id: apk_sha
        env:
          SIGNED_APK: ${{ steps.sign-apk.outputs.SIGNED_APK }}
        run: |
          set -euo pipefail
          echo "sha256=$(sha256sum $SIGNED_APK | cut -d' ' -f1)" >> $GITHUB_OUTPUT

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: apks
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/*.apk
          retention-days: 30

  deploy-pages:
    name: Deploy to GitHub Pages
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Create latest-release.json
        run: |
          mkdir site
          cat > site/latest-release.json << EOF
          {
            "versionName": "${{ needs.build.outputs.version_name }}",
            "versionCode": ${{ needs.build.outputs.version_code }},
            "releaseUrl": "${{ needs.build.outputs.release_url }}",
            "releaseNotes": "${{ needs.build.outputs.release_notes }}",
            "apkUrl": "${{ needs.build.outputs.apk_url }}",
            "sha256": "${{ needs.build.outputs.apk_sha256 }}",
            "tagName": "${{ github.ref_name }}",
            "publishedAt": "$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          }
          EOF
          cat site/latest-release.json

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
          name: github-pages

      - name: Deploy Pages
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages
