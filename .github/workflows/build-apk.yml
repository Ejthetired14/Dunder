name: Build APK

on:
  push:
    branches: [ main, kilo/** ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Debug & Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version_name: ${{ steps.version.outputs.version_name }}
      version_code: ${{ steps.version.outputs.version_code }}
      release_url: ${{ steps.release.outputs.html_url }}
      release_notes: ${{ steps.release.outputs.body }}
      apk_url: ${{ steps.apk_url.outputs.url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 35
          ndk-version: r27c
          build-tools-version: 35.0.0
          cmake-version: 3.22.1
          emulator: false
          packages: ''

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses

      - name: Install required SDK packages
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools" "cmdline-tools;latest"

      - name: Cache Gradle wrapper
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/wrapper
            ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Extract version from build.gradle.kts
        id: version
        run: |
          VERSION_NAME=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          VERSION_CODE=$(grep -oP 'versionCode\s*=\s*\K\d+' app/build.gradle.kts)
          echo "version_name=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "version_code=$VERSION_CODE" >> $GITHUB_OUTPUT

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Build Release APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Sign Release APK
        if: startsWith(github.ref, 'refs/tags/v') && env.KEYSTORE_BASE64 != ''
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > release-key.jks
          apksigner sign \
            --ks release-key.jks \
            --ks-pass pass:${{ secrets.KEYSTORE_PASSWORD }} \
            --ks-key-alias ${{ secrets.KEY_ALIAS }} \
            --key-pass pass:${{ secrets.KEY_PASSWORD }} \
            --out app/build/outputs/apk/release/app-release-signed.apk \
            app/build/outputs/apk/release/app-release-unsigned.apk
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Create Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        id: release
        run: |
          if [ -f "app/build/outputs/apk/release/app-release-signed.apk" ]; then
            RELEASE_APK="app/build/outputs/apk/release/app-release-signed.apk"
          else
            RELEASE_APK="app/build/outputs/apk/release/app-release-unsigned.apk"
          fi
          gh release create ${{ github.ref_name }} \
            app/build/outputs/apk/debug/app-debug.apk \
            "$RELEASE_APK" \
            --title "Dunder v${{ github.ref_name }}" \
            --notes "Debug and release APKs for ${{ github.ref_name }}"
          RELEASE_INFO=$(gh release view ${{ github.ref_name }} --json url,body --jq '{url: .url, body: .body}')
          echo "html_url=$(echo $RELEASE_INFO | jq -r .url)" >> $GITHUB_OUTPUT
          echo "body=$(echo $RELEASE_INFO | jq -r .body | sed ':a;N;$!ba;s/\n/\\n/g' | sed 's/"/\\"/g')" >> $GITHUB_OUTPUT
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Get APK download URL
        if: startsWith(github.ref, 'refs/tags/v')
        id: apk_url
        run: |
          if [ -f "app/build/outputs/apk/release/app-release-signed.apk" ]; then
            APK_NAME="app-release-signed.apk"
          else
            APK_NAME="app-release-unsigned.apk"
          fi
          URL="https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/$APK_NAME"
          echo "url=$URL" >> $GITHUB_OUTPUT

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: app-release-unsigned
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          retention-days: 30

      - name: Upload Signed Release APK
        if: startsWith(github.ref, 'refs/tags/v') && env.KEYSTORE_BASE64 != ''
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: app-release-signed
          path: app/build/outputs/apk/release/app-release-signed.apk
          retention-days: 30

      - name: Upload APKs to workflow run (always available)
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: all-apks
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release-unsigned.apk
            app/build/outputs/apk/release/app-release-signed.apk
          retention-days: 30

  update-latest-release:
    name: Update latest-release branch
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout latest-release branch
        uses: actions/checkout@v4
        with:
          ref: latest-release
          persist-credentials: false

      - name: Create latest-release.json
        run: |
          cat > latest-release.json << 'EOF'
          {
            "versionName": "${{ needs.build.outputs.version_name }}",
            "versionCode": ${{ needs.build.outputs.version_code }},
            "releaseUrl": "${{ needs.build.outputs.release_url }}",
            "releaseNotes": "${{ needs.build.outputs.release_notes }}",
            "apkUrl": "${{ needs.build.outputs.apk_url }}",
            "tagName": "${{ github.ref_name }}",
            "publishedAt": "$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          }
          EOF
          cat latest-release.json

      - name: Commit and push latest-release.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add latest-release.json
          if ! git diff --cached --quiet; then
            git commit -m "Update latest release to ${{ github.ref_name }}"
            git push origin HEAD:latest-release
          else
            echo "No changes to commit"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}