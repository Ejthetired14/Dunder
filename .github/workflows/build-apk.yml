name: Build APK

on:
  push:
    branches: [ main, kilo/** ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    name: Build Debug & Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      version_name: ${{ steps.version.outputs.version_name }}
      version_code: ${{ steps.version.outputs.version_code }}
      release_url: ${{ steps.release.outputs.html_url }}
      release_notes: ${{ steps.release.outputs.body }}
      apk_url: ${{ steps.apk_url.outputs.url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Install Android SDK (manual)
        run: |
          mkdir -p "$ANDROID_HOME"
          wget -q "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" -O /tmp/cmdline-tools.zip
          unzip -q /tmp/cmdline-tools.zip -d /tmp/cmdline-tools
          mv /tmp/cmdline-tools/cmdline-tools "$ANDROID_HOME/cmdline-tools/latest"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "platforms;android-35" "build-tools;34.0.0" "build-tools;35.0.0" "platform-tools"
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/wrapper
            ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Print versions
        run: |
          java -version
          ./gradlew --version

      - name: Extract version
        id: version
        run: |
          VERSION_NAME=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          VERSION_CODE=$(grep -oP 'versionCode\s*=\s*\K\d+' app/build.gradle.kts)
          echo "version_name=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "version_code=$VERSION_CODE" >> $GITHUB_OUTPUT

      - name: Build Debug APK
        run: |
          ok=0
          for i in 1 2 3; do
            echo "=== Build Debug APK attempt $i ==="
            if ./gradlew assembleDebug --no-daemon -x lint --stacktrace 2>&1; then
              echo "Build Debug APK succeeded on attempt $i"
              ok=1
              break
            fi
            echo "Attempt $i failed"
            [ "$i" -lt 3 ] && sleep 30
          done
          if [ "$ok" -ne 1 ]; then
            echo "::error::assembleDebug failed on all 3 attempts"
            exit 1
          fi

      - name: Build Release APK
        run: |
          ok=0
          for i in 1 2 3; do
            echo "=== Build Release APK attempt $i ==="
            if ./gradlew assembleRelease --no-daemon -x lint --stacktrace 2>&1; then
              echo "Build Release APK succeeded on attempt $i"
              ok=1
              break
            fi
            echo "Attempt $i failed"
            [ "$i" -lt 3 ] && sleep 30
          done
          if [ "$ok" -ne 1 ]; then
            echo "::error::assembleRelease failed on all 3 attempts"
            exit 1
          fi

      - name: Find APKs
        id: find-apks
        run: |
          set +e
          ls -la app/build/outputs/apk/debug
          ls -la app/build/outputs/apk/release

          DEBUG_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$DEBUG_APK" ]; then
            DEBUG_APK=$(find app/build -name '*debug*.apk' | head -1)
          fi

          RELEASE_APK_UNSIGNED="app/build/outputs/apk/release/app-release-unsigned.apk"
          if [ ! -f "$RELEASE_APK_UNSIGNED" ]; then
            RELEASE_APK_UNSIGNED=$(find app/build -name '*.apk' -not -name '*debug*' -not -name '*signed*' | head -1)
          fi

          if [ -z "$DEBUG_APK" ] || [ ! -f "$DEBUG_APK" ]; then
            echo "::error::No debug APK was produced"
            exit 1
          fi
          if [ -z "$RELEASE_APK_UNSIGNED" ] || [ ! -f "$RELEASE_APK_UNSIGNED" ]; then
            echo "::error::No unsigned release APK was produced"
            exit 1
          fi

          echo "DEBUG_APK=$DEBUG_APK" >> $GITHUB_OUTPUT
          echo "RELEASE_APK_UNSIGNED=$RELEASE_APK_UNSIGNED" >> $GITHUB_OUTPUT
          echo "debug APK: $DEBUG_APK"
          echo "release APK: $RELEASE_APK_UNSIGNED"

      - name: Sign Release APK
        if: startsWith(github.ref, 'refs/tags/v')
        id: sign-apk
        run: |
          set -euo pipefail

          APKSIGNER=$(find "$ANDROID_HOME" -name "apksigner" -type f | head -1)
          [ -n "$APKSIGNER" ] || { echo "::error::apksigner not found"; exit 1; }

          UNSIGNED="${{ steps.find-apks.outputs.RELEASE_APK_UNSIGNED }}"
          [ -n "$UNSIGNED" ] && [ -f "$UNSIGNED" ] || { echo "::error::Unsigned APK missing: $UNSIGNED"; exit 1; }

          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ] && [ -n "${{ secrets.KEYSTORE_PASSWORD }}" ]; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > release-key.jks
            PASS="${{ secrets.KEYSTORE_PASSWORD }}"
            ALIAS="${{ secrets.KEY_ALIAS }}"
            KPASS="${{ secrets.KEY_PASSWORD }}"
          else
            echo "::warning::No keystore secret configured, signing with a temporary key"
            PASS=$(openssl rand -base64 24 | tr -d "=+/")
            ALIAS="dunder-release"
            KPASS="$PASS"
            keytool -genkey -v -keystore release-key.jks -keyalg RSA -keysize 2048 -validity 10000 -alias "$ALIAS" -storepass "$PASS" -keypass "$KPASS" -dname "CN=Dunder,O=Dunder,L=Local,ST=State,C=US"
          fi

          SIGNED="app/build/outputs/apk/release/app-release-signed.apk"
          "$APKSIGNER" sign --ks release-key.jks --ks-pass pass:"$PASS" --ks-key-alias "$ALIAS" --key-pass pass:"$KPASS" --out "$SIGNED" "$UNSIGNED"
          echo "SIGNED_APK=$SIGNED" >> $GITHUB_OUTPUT
          echo "Signed OK: $SIGNED"

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        id: release
        run: |
          set -euo pipefail
          DEBUG_APK="${{ steps.find-apks.outputs.DEBUG_APK }}"
          SIGNED_APK="${{ steps.sign-apk.outputs.SIGNED_APK }}"

          [ -f "$DEBUG_APK" ] || { echo "::error::Debug APK not found: $DEBUG_APK"; exit 1; }
          [ -f "$SIGNED_APK" ] || { echo "::error::Signed APK not found: $SIGNED_APK"; exit 1; }

          gh release delete "${{ github.ref_name }}" --yes 2>/dev/null || true
          gh release create "${{ github.ref_name }}" \
            "$DEBUG_APK" \
            "$SIGNED_APK" \
            --title "Dunder ${{ github.ref_name }}" \
            --notes "Debug and release APKs for ${{ github.ref_name }}"

          URL=$(gh release view "${{ github.ref_name }}" --json url --jq .url)
          BODY=$(gh release view "${{ github.ref_name }}" --json body --jq .body | sed ':a;N;$!ba;s/\n/\\n/g' | sed 's/"/\\"/g')
          echo "html_url=$URL" >> $GITHUB_OUTPUT
          echo "body=$BODY" >> $GITHUB_OUTPUT
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: APK URL
        if: startsWith(github.ref, 'refs/tags/v')
        id: apk_url
        run: |
          SIGNED_APK="${{ steps.sign-apk.outputs.SIGNED_APK }}"
          echo "url=https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/$(basename "$SIGNED_APK")" >> $GITHUB_OUTPUT

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: apks
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/*.apk
          retention-days: 30

  deploy-pages:
    name: Deploy to GitHub Pages
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Create latest-release.json
        run: |
          mkdir site
          cat > site/latest-release.json << EOF
          {
            "versionName": "${{ needs.build.outputs.version_name }}",
            "versionCode": ${{ needs.build.outputs.version_code }},
            "releaseUrl": "${{ needs.build.outputs.release_url }}",
            "releaseNotes": "${{ needs.build.outputs.release_notes }}",
            "apkUrl": "${{ needs.build.outputs.apk_url }}",
            "tagName": "${{ github.ref_name }}",
            "publishedAt": "$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          }
          EOF
          cat site/latest-release.json

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
          name: latest-release

      - name: Deploy Pages
        uses: actions/deploy-pages@v4
        with:
          artifact_name: latest-release