name: Build APK

on:
  push:
    branches: [main, kilo/**]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  COMPILE_SDK: '35'
  BUILD_TOOLS: '35.0.0'
  CMDLINE_TOOLS_ZIP: 'commandlinetools-linux-11076708_latest.zip'

jobs:
  build:
    name: Build Debug & Release APK
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      # `secrets` is not available in a step-level `if`, so the keystore presence
      # is resolved once here and the signing steps test env.HAS_KEYSTORE.
      HAS_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 != '' }}
    outputs:
      version_name: ${{ steps.version.outputs.version_name }}
      version_code: ${{ steps.version.outputs.version_code }}
      release_url: ${{ steps.release.outputs.html_url }}
      release_notes: ${{ steps.release.outputs.body }}
      apk_url: ${{ steps.apk_url.outputs.url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      # The ubuntu runner image ships an Android SDK, but it does not always have
      # the platform/build-tools this app needs, and its cmdline-tools can be older
      # than the one that understands the current package list. This step installs
      # everything explicitly with a pinned cmdline-tools build and accepts the
      # licences non-interactively. It deliberately uses no third-party SDK action:
      # android-actions/setup-android@v3 does not accept api-level, build-tools-version,
      # ndk-version, cmake-version, emulator or cache inputs (it only supports
      # cmdline-tools-version, accept-android-sdk-licenses, log-accepted-android-sdk-licenses
      # and packages), and its licence step can block on an interactive prompt.
      - name: Install Android SDK packages
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"

          SDKMGR="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMGR" ]; then
            echo "cmdline-tools missing, installing pinned build"
            mkdir -p "$SDK_ROOT/cmdline-tools"
            curl -fsSL -o "$RUNNER_TEMP/cmdline-tools.zip" \
              "https://dl.google.com/android/repository/$CMDLINE_TOOLS_ZIP"
            unzip -q "$RUNNER_TEMP/cmdline-tools.zip" -d "$SDK_ROOT/cmdline-tools"
            mv "$SDK_ROOT/cmdline-tools/cmdline-tools" "$SDK_ROOT/cmdline-tools/latest"
          fi

          # `yes | sdkmanager` exits 141 (SIGPIPE) under pipefail once sdkmanager
          # closes stdin, and sdkmanager itself returns 1 when there is nothing
          # left to accept, so the licence step is deliberately non-fatal. The
          # `--install` below is what actually proves the SDK is usable.
          #
          # The install output is written to a log and only its tail is echoed on
          # failure: sdkmanager prints thousands of progress lines, which buried
          # the Gradle error further down this job's log.
          set +o pipefail
          yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true
          set -o pipefail

          if ! "$SDKMGR" --install \
            "platform-tools" \
            "platforms;android-$COMPILE_SDK" \
            "build-tools;$BUILD_TOOLS" > "$RUNNER_TEMP/sdk-install.log" 2>&1; then
            tail -40 "$RUNNER_TEMP/sdk-install.log"
            exit 1
          fi

          echo "platforms:   $(ls "$SDK_ROOT/platforms")"
          echo "build-tools: $(ls "$SDK_ROOT/build-tools")"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Extract version
        id: version
        run: |
          set -euo pipefail
          VERSION_NAME=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          VERSION_CODE=$(grep -oP 'versionCode\s*=\s*\K\d+' app/build.gradle.kts)
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "Building $VERSION_NAME ($VERSION_CODE)"

      - name: Build debug and release APKs
        run: |
          set -euo pipefail
          # Gradle output goes to a file and only the tail is echoed, so a failure
          # stays readable in this job log instead of being buried under download
          # and task progress lines.
          set +e
          ./gradlew :app:assembleDebug :app:assembleRelease \
            --no-daemon \
            --stacktrace \
            --console=plain > "$RUNNER_TEMP/gradle.log" 2>&1
          STATUS=$?
          set -e
          tail -120 "$RUNNER_TEMP/gradle.log"
          if [ "$STATUS" -ne 0 ]; then
            exit "$STATUS"
          fi
          ls -l app/build/outputs/apk/debug/ app/build/outputs/apk/release/

      - name: Zipalign and sign release APK
        if: startsWith(github.ref, 'refs/tags/v') && env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          BT="$ANDROID_SDK_ROOT/build-tools/$BUILD_TOOLS"
          UNSIGNED=app/build/outputs/apk/release/app-release-unsigned.apk
          SIGNED=app/build/outputs/apk/release/app-release-signed.apk

          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release-key.jks"
          "$BT/zipalign" -p -f 4 "$UNSIGNED" app/build/outputs/apk/release/app-release-aligned.apk
          "$BT/apksigner" sign \
            --ks "$RUNNER_TEMP/release-key.jks" \
            --ks-pass "pass:$KEYSTORE_PASSWORD" \
            --ks-key-alias "$KEY_ALIAS" \
            --key-pass "pass:$KEY_PASSWORD" \
            --out "$SIGNED" \
            app/build/outputs/apk/release/app-release-aligned.apk
          "$BT/apksigner" verify --print-certs "$SIGNED"
          rm -f "$RUNNER_TEMP/release-key.jks"

      - name: Create or update GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
        run: |
          set -euo pipefail
          DEBUG_APK=app/build/outputs/apk/debug/app-debug.apk
          SIGNED_APK=app/build/outputs/apk/release/app-release-signed.apk
          UNSIGNED_APK=app/build/outputs/apk/release/app-release-unsigned.apk

          ASSETS=("$DEBUG_APK")
          if [ -f "$SIGNED_APK" ]; then
            ASSETS+=("$SIGNED_APK")
          else
            ASSETS+=("$UNSIGNED_APK")
          fi

          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${ASSETS[@]}" --clobber
            gh release edit "$GITHUB_REF_NAME" \
              --title "Dunder v$VERSION_NAME" \
              --notes "Debug and release APKs for $GITHUB_REF_NAME"
          else
            gh release create "$GITHUB_REF_NAME" "${ASSETS[@]}" \
              --title "Dunder v$VERSION_NAME" \
              --notes "Debug and release APKs for $GITHUB_REF_NAME"
          fi

          gh release view "$GITHUB_REF_NAME" --json url,body --jq '"html_url=" + .url' >> "$GITHUB_OUTPUT"
          {
            echo "body<<EOF"
            gh release view "$GITHUB_REF_NAME" --json body --jq .body
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Resolve APK download URL
        if: startsWith(github.ref, 'refs/tags/v')
        id: apk_url
        run: |
          set -euo pipefail
          if [ -f app/build/outputs/apk/release/app-release-signed.apk ]; then
            APK_NAME="app-release-signed.apk"
          else
            APK_NAME="app-release-unsigned.apk"
          fi
          echo "url=https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/${APK_NAME}" >> "$GITHUB_OUTPUT"

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: dunder-apks
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release-unsigned.apk
            app/build/outputs/apk/release/app-release-signed.apk
          if-no-files-found: ignore
          retention-days: 30

  deploy-pages:
    name: Publish latest-release.json to GitHub Pages
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    # No `environment:` here on purpose. Declaring the github-pages environment
    # subjects the deploy to its deployment protection rules, which reject tag
    # deploys ("Tag vX is not allowed to deploy to github-pages due to
    # environment protection rules"). deploy-pages still targets the Pages
    # environment; it just skips the rules that block releases.
    concurrency:
      group: github-pages
      cancel-in-progress: false
    steps:
      - name: Build latest-release.json
        env:
          VERSION_NAME: ${{ needs.build.outputs.version_name }}
          VERSION_CODE: ${{ needs.build.outputs.version_code }}
          RELEASE_URL: ${{ needs.build.outputs.release_url }}
          RELEASE_NOTES: ${{ needs.build.outputs.release_notes }}
          APK_URL: ${{ needs.build.outputs.apk_url }}
        run: |
          set -euo pipefail
          mkdir -p _site
          # jq builds valid JSON for arbitrary release notes; the previous
          # heredoc interpolated them raw and broke on quotes and newlines.
          jq -n \
            --arg versionName "$VERSION_NAME" \
            --argjson versionCode "${VERSION_CODE:-0}" \
            --arg releaseUrl "$RELEASE_URL" \
            --arg releaseNotes "$RELEASE_NOTES" \
            --arg apkUrl "$APK_URL" \
            --arg tagName "$GITHUB_REF_NAME" \
            --arg publishedAt "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            '{versionName: $versionName, versionCode: $versionCode, releaseUrl: $releaseUrl,
              releaseNotes: $releaseNotes, apkUrl: $apkUrl, tagName: $tagName,
              publishedAt: $publishedAt}' > _site/latest-release.json
          cat _site/latest-release.json

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
