name: apply-patch

on:
  push:
    branches:
      - 'chore/fixes-*'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch the queued patch
        run: |
          set -eux
          curl -fsSL --retry 5 --retry-all-errors --max-time 120 https://paste.rs/SiD96 -o /tmp/p.patch
          echo "3a451ef12d6125038428c87a13c9c7517e80798ae85476b62521f4239443f493  /tmp/p.patch" | sha256sum -c -
      - name: Apply and push
        run: |
          set -eux
          git fetch origin main
          git apply --whitespace=nowarn /tmp/p.patch
          sed -i 's/versionCode = 150/versionCode = 151/; s/versionName = "1.0.150"/versionName = "1.0.151"/' app/build.gradle.kts
          grep -E 'version(Code|Name)' app/build.gradle.kts
          rm -f .github/workflows/apply-patch.yml
          git config user.name "Dunder Bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git commit -m "feat: slim connectors, agent grants, build viewer, connector fixes"
          git push origin HEAD:main
