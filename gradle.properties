systemProp.javax.net.ssl.trustStore=/etc/ssl/certs/java/cacerts
systemProp.javax.net.ssl.trustStorePassword=changeit
systemProp.javax.net.ssl.trustStoreType=JKS

# Build memory: the Compose + KSP build needs more than the 512 MB default heap.
org.gradle.jvmargs=-Xmx2560m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8 -Djavax.net.ssl.trustStore=/etc/ssl/certs/java/cacerts -Djavax.net.ssl.trustStorePassword=changeit

org.gradle.parallel=true
org.gradle.caching=true

kotlin.code.style=official

# AndroidX
android.useAndroidX=true
# Generates R classes per module instead of one giant merged class: faster builds.
android.nonTransitiveRClass=true