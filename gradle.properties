# Build memory: the Compose + KSP build needs more than the 512 MB default heap.
org.gradle.jvmargs=-Xmx2560m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

kotlin.code.style=official

# AndroidX
android.useAndroidX=true
# Generates R classes per module instead of one giant merged class: faster builds.
android.nonTransitiveRClass=true
